name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate missing debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Mock google-services.json
        run: |
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "dummy-ci-project" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": { "package_name": "com.dummy.app" }
              },
              "api_key": [{ "current_key": "dummy-api-key" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Remove Legacy Compose Compiler Flags
        run: |
          # The previous AbstractMethodError was caused by lingering 'kotlinCompilerExtensionVersion' 
          # configs conflicting with the modern Kotlin Compose plugin already present in the project.
          # Safely removing these legacy flags resolves the mismatch without duplicating plugin requests.
          find . -name "*.gradle.kts" -type f -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
          find . -name "*.gradle" -type f -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +

      - name: Ensure Gradle wrapper executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Pksp.incremental=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
