name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate missing debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Mock google-services.json
        run: |
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "dummy-ci-project" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": { "package_name": "com.dummy.app" }
              },
              "api_key": [{ "current_key": "dummy-api-key" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Fix Compose & Kotlin AbstractMethodError
        run: |
          # 1. Extract Kotlin version dynamically from project files
          KOTLIN_VER=""
          if [ -f gradle/libs.versions.toml ]; then
            KOTLIN_VER=$(grep -oP 'kotlin\s*=\s*"\K[^"]+' gradle/libs.versions.toml | head -1)
          fi
          if [ -z "$KOTLIN_VER" ] && [ -f build.gradle.kts ]; then
            KOTLIN_VER=$(grep -oP 'org\.jetbrains\.kotlin\.android"\)\s*version\s*"\K[^"]+' build.gradle.kts | head -1)
          fi
          if [ -z "$KOTLIN_VER" ]; then
            KOTLIN_VER="2.0.0" # Fallback
          fi
          
          echo "Detected Kotlin version: $KOTLIN_VER"
          
          if [[ "$KOTLIN_VER" == 2.* ]]; then
            echo "Applying Kotlin 2.x Compose Compiler Plugin fix..."
            # Remove legacy androidx.compose.compiler configurations which trigger AbstractMethodError
            find . -name "*.gradle.kts" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
            
            # Inject modern Compose Compiler plugin into root build.gradle.kts if missing
            if [ -f build.gradle.kts ] && ! grep -q 'org.jetbrains.kotlin.plugin.compose' build.gradle.kts; then
              awk -v ver="$KOTLIN_VER" '/plugins \{/ && !done { print; print "    id(\"org.jetbrains.kotlin.plugin.compose\") version \"" ver "\" apply false"; done=1; next }1' build.gradle.kts > temp.kts && mv temp.kts build.gradle.kts
            fi
            
            # Inject modern Compose Compiler plugin into app/build.gradle.kts if missing
            if [ -f app/build.gradle.kts ] && ! grep -q 'org.jetbrains.kotlin.plugin.compose' app/build.gradle.kts; then
              awk '/plugins \{/ && !done { print; print "    id(\"org.jetbrains.kotlin.plugin.compose\")"; done=1; next }1' app/build.gradle.kts > temp.kts && mv temp.kts app/build.gradle.kts
            fi
          else
            echo "Applying Kotlin 1.x Compatibility fix..."
            # For older Kotlin versions like 1.9.24, strictly align the Compose Compiler extension version
            find . -name "*.gradle.kts" -exec sed -i -E 's/kotlinCompilerExtensionVersion\s*=\s*".*"/kotlinCompilerExtensionVersion = "1.5.14"/g' {} +
          fi

      - name: Ensure Gradle wrapper executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Pksp.incremental=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
